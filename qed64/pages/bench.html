<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LeanUI keyed (QED64)</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="../bench.css"></head>
<body><div id="app"></div><script src="leanui.js"></script><script src="leanui-qed64.js"></script><script>
LeanUIQed64.start({ selector: "#app" }).then((rt) => {
  window.__leanui = rt; window.__lane = rt.transport.lane; window.__idle = () => rt.transport.idle(); window.__ready = performance.now();
  console.log("LeanUI (QED64) ready in", rt.bootMs.toFixed(1), "ms");
}, (e) => { console.error("LeanUI failed to start:", e); document.getElementById("app").textContent = "LeanUI failed to start: " + e.message; window.__failed = String(e && e.message || e); });
</script></body></html>
