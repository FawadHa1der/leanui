<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeanUI Video · the photo editor's filters on every frame</title>
<meta name="description" content="A video played by the browser, every frame run through image filters written in Lean 4 and compiled to WebAssembly.">
<style>
  :root { --bg: #1b1d21; --panel: #24272c; --panel2: #2c3036; --line: #383c43; --ink: #e6e7e9; --muted: #9aa0a8; --accent: #4f8cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #app { max-width: 1400px; margin: 0 auto; padding: 12px 16px 32px; }
  button, select, input { font: inherit; color: inherit; }
  select { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 8px 0; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
  a { color: var(--accent); }
  .intro { color: var(--muted); max-width: 80ch; margin: 4px 0 12px; }
  .controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .controls label { display: flex; align-items: center; gap: 6px; }
  .file { position: relative; overflow: hidden; background: #2f6be0; border: 1px solid var(--accent); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .stats { font-variant-numeric: tabular-nums; }
  .stats output { font-weight: 600; }
  .status { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 800px) { .panes { grid-template-columns: 1fr; } }
  figure { margin: 0; background: #111215; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  figure video, figure canvas { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; background: #000; }
  figure canvas[width="0"] { aspect-ratio: 16 / 9; }
  figcaption { color: var(--muted); margin-top: 6px; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="leanui.js"></script>
<script>
  LeanUI.start({ glue: "app.js", selector: "#app" }).then((rt) => {
    window.__leanui = rt; window.__ready = performance.now();
  }, (e) => {
    document.getElementById("app").textContent = LeanUI.supported()
      ? "The video lab failed to start: " + e.message
      : "This page runs Lean compiled to WebAssembly with 64-bit memory (Memory64), which this browser does not support yet. Chrome, Edge 133+ and Firefox 134+ do.";
  });
</script>
</body>
</html>
