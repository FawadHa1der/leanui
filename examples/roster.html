<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster · can we staff this? (LeanUI)</title>
<!-- The style is inline: tools/build-app.sh copies this page, and only this page, next to the app. -->
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1f2328; --muted: #656d76; --line: #d0d7de;
    --cell: #eef1f4; --can: #cdeed8; --works: #1f883d; --on-works: #fff;
    --hl: #f2c94c; --hl-soft: #fff4cc; --ok: #1f883d; --warn: #b7791f; --bad: #cf222e; --accent: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --ink: #e6edf3; --muted: #8d96a0; --line: #30363d;
      --cell: #21262d; --can: #1d4430; --works: #3fb950; --on-works: #0b2e17;
      --hl: #d4a72c; --hl-soft: #3a2f10; --ok: #3fb950; --warn: #d4a72c; --bad: #f85149; --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .roster { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 650; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  .lead { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
  button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 16px; }
  .presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; margin: 0; border-radius: 10px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch input:checked { background: var(--bad); }
  .switch input:checked::after { left: 16px; }
  #ask { margin-left: auto; }

  .result { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; }
  .result p { margin: 6px 0; }
  .result.staffed { border-left-color: var(--ok); }
  .result.impossible { border-left-color: var(--warn); }
  .result.rejected { border-left-color: var(--bad); }
  .result.staffed h2 { color: var(--ok); }
  .result.impossible h2 { color: var(--warn); }
  .result.rejected h2 { color: var(--bad); }
  #why { font-weight: 600; }
  .checked { color: var(--muted); font-size: 13px; }
  .notary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  .notary.done a { font-weight: 600; color: var(--accent); }
  #notary-error { color: var(--bad); }

  .grid-wrap { overflow-x: auto; }
  .grid { border-collapse: separate; border-spacing: 2px; }
  .grid th { font-weight: 500; font-size: 13px; }
  .grid th.shift { width: 76px; min-width: 64px; vertical-align: bottom; padding: 2px 2px 6px; line-height: 1.2; }
  .grid th.person, .grid tr th[scope=row] { text-align: right; padding: 0 8px 0 0; white-space: nowrap; color: var(--muted); }
  .grid th.person { color: var(--ink); }
  .grid td { padding: 0; }
  .cell { display: block; width: 100%; height: 28px; padding: 0; border: 0; border-radius: 4px; background: var(--cell); font-weight: 700; }
  .cell.can { background: var(--can); }
  .cell.works { background: var(--works); color: var(--on-works); }
  .cell:hover { outline: 2px solid var(--muted); outline-offset: -2px; }
  .need { text-align: center; white-space: nowrap; }
  .need output { display: inline-block; min-width: 1.6em; font-weight: 650; }
  .need button { padding: 0 6px; line-height: 20px; border-radius: 4px; }
  .count { text-align: center; color: var(--ok); font-weight: 650; font-size: 13px; }
  /* explaining an impossible problem: the shifts and the people able to do them stand out */
  .grid th.shift.short { background: var(--hl); color: #1f2328; border-radius: 4px; font-weight: 650; }
  .grid th.person.able { background: var(--hl-soft); border-radius: 4px; font-weight: 650; }
  .cell.hl { box-shadow: inset 0 0 0 2px var(--hl); }
  .grid.explaining .cell:not(.hl) { opacity: .35; }
  .grid.explaining th.person:not(.able) { opacity: .45; }

  .legend { color: var(--muted); font-size: 13px; margin: 8px 0 24px; }
  .swatch { display: inline-block; width: 18px; height: 14px; border-radius: 3px; vertical-align: -2px; background: var(--cell); margin-left: 6px; font-size: 10px; line-height: 14px; text-align: center; font-weight: 700; }
  .swatch.can { background: var(--can); }
  .swatch.works { background: var(--works); color: var(--on-works); }

  .proved { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .kinds { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .proved ul { list-style: none; margin: 0; padding: 0; }
  .proved li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .proved li p { margin: 0; }
  .kind { flex: none; width: 26px; height: 22px; border-radius: 11px; background: var(--cell); text-align: center; font-weight: 700; font-size: 13px; line-height: 22px; }
  .trusts { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="leanui.js"></script>
<script>
  LeanUI.start({ glue: "app.js", selector: "#app" })
    .then((rt) => { window.__leanui = rt; window.__ready = performance.now(); },
          (e) => {
            console.error("LeanUI failed to start:", e);
            document.getElementById("app").textContent = LeanUI.supported()
              ? "LeanUI failed to start: " + e.message
              : "This demo runs Lean compiled to WebAssembly with 64-bit memory (Memory64), which this browser does not support yet. Chrome, Edge 133+ and Firefox 134+ do.";
          });
</script>
</body>
</html>
