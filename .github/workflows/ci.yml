# Build and test everything (native, then wasm64, lean-vir and the QED64 lane in Chromium and
# Firefox), and check the Roster demo's completeness proof against Mathlib; on main, deploy the LeanUI
# site to Cloudflare Containers (also on a manual run of main). Setup and secrets: docs/DEPLOY.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labelled: adding the `bench` label runs the benchmarks (below)
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # The race's QED64 lane is built and raced, or the job fails (tests/browser/run-all.sh)
    env:
      LEANUI_QED64: require
    steps:
      - uses: actions/checkout@v7

      # Caches are restored and saved explicitly: actions/cache saves only when the whole job
      # succeeds, and the archives below take half an hour to rebuild.
      # Separate Lean releases for the main build and VIR; the Roster notary and QED64 lane
      # retain Lean 4.35. Elan's lake selects the toolchain named by each project directory.
      - name: Restore the Lean toolchains
        id: elan
        uses: actions/cache/restore@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'vir/lean-toolchain', 'roster/notary/lean-toolchain', 'qed64/lean-toolchain') }}
      - name: Install the Lean toolchains
        if: steps.elan.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$(cat vir/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$(cat roster/notary/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$(cat qed64/lean-toolchain)"
      - name: Save the Lean toolchains
        if: steps.elan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.elan
          key: ${{ steps.elan.outputs.cache-primary-key }}
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore the Lake build
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}-${{ github.sha }}
          # a build from an older lakefile is still a good start: Lake rebuilds what changed
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}-
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-
      - name: Build (native)
        run: lake build
      - name: Save the Lake build
        uses: actions/cache/save@v6
        with:
          path: .lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}-${{ github.sha }}

      - name: Native tests
        run: |
          failed=""
          for t in leanui-tests leanui-props leanui-syntax-tests leanui-kit-tests leanui-server-tests \
                   leanui-todomvc-tests leanui-notes-tests leanui-editor-tests; do
            echo "::group::$t"
            .lake/build/bin/$t || failed="$failed $t"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed:$failed"; exit 1; }

      # The single-threaded wasm64 Lean archives (toolchain/build-archives.sh, ~30 min cold) depend
      # only on the pinned fork, the patch and the script.
      - name: Restore the wasm64 archives
        id: archives
        uses: actions/cache/restore@v6
        with:
          path: .toolchain/wasm64
          key: wasm64-archives-${{ hashFiles('toolchain/fork.lock', 'toolchain/lean-wasm-threads.patch', 'toolchain/build-archives.sh') }}
      - name: Toolchain image
        run: toolchain/image.sh
      - name: Build the wasm64 archives
        if: steps.archives.outputs.cache-hit != 'true'
        run: toolchain/build-archives.sh
      - name: Save the wasm64 archives
        if: steps.archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .toolchain/wasm64
          key: ${{ steps.archives.outputs.cache-primary-key }}

      # ccache (tools/build-app.sh's compiler cache): app builds reuse the objects of earlier runs.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .toolchain/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      # The lean-vir build (vir/build.sh, apart from the main build: vir/README.md): lean-vir's
      # checkout and build, its prebuilt interpreter, and LeanUI and the apps compiled by its Lean.
      - name: Restore the lean-vir build
        uses: actions/cache/restore@v6
        with:
          path: vir/.lake
          key: vir-lake-${{ runner.os }}-${{ hashFiles('vir/lean-toolchain') }}-${{ hashFiles('vir/lakefile.toml', 'vir/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            vir-lake-${{ runner.os }}-${{ hashFiles('vir/lean-toolchain') }}-${{ hashFiles('vir/lakefile.toml', 'vir/lake-manifest.json') }}-
            vir-lake-${{ runner.os }}-${{ hashFiles('vir/lean-toolchain') }}-
      # The QED64 lane (qed64/README.md), in two caches. Per lock (qed64.lock.json and
      # qed64/lean-toolchain): the downloads (about 260 MB: QED64's runtime and Init, Node 24) and
      # what qed64/tools/bake.sh makes from them alone (Std compiled by lean.wasm, lean.wasm's .br
      # and .gz), about 620 MB unpacked. Per source: the rest of bake.sh's work (LeanUI, the apps and
      # the host compiled by lean.wasm, the snapshot) and the native reference (qed64/.lake), about
      # 70 MB. bake.sh's stamp decides what to redo, so the newest build for the lock is a start.
      - name: Restore the QED64 lane's downloads
        id: qed64-pin
        uses: actions/cache/restore@v6
        with:
          path: |
            qed64/.cache/rt
            qed64/.cache/init
            qed64/.cache/node
            qed64/.cache/build/init-olean
            qed64/.cache/build/std
            qed64/.cache/build/std-olean
            qed64/.cache/build/wasm
          key: qed64-pin-${{ runner.os }}-${{ hashFiles('qed64/qed64.lock.json', 'qed64/lean-toolchain') }}
      - name: Restore the QED64 lane's build
        id: qed64-build
        uses: actions/cache/restore@v6
        with:
          path: |
            qed64/.cache/build/out
            qed64/.cache/build/snap
            qed64/.lake
          key: qed64-build-${{ runner.os }}-${{ hashFiles('qed64/qed64.lock.json', 'qed64/lean-toolchain') }}-${{ hashFiles('LeanUI.lean', 'LeanUI/**/*.lean', 'examples/Bench.lean', 'examples/Life.lean', 'qed64/LeanUIQed/**', 'qed64/run/**', 'qed64/tools/**', 'qed64/lakefile.toml', 'qed64/lake-manifest.json') }}
          restore-keys: qed64-build-${{ runner.os }}-${{ hashFiles('qed64/qed64.lock.json', 'qed64/lean-toolchain') }}-
      # The Roster verify page's checker: nanoda, a Lean kernel in Rust, as a WASI command
      # (roster/verify/build.sh)
      - name: Rust's wasm32-wasip1 target
        run: rustup target add wasm32-wasip1
      - name: Build the apps (wasm64, lean-vir, the QED64 lane), the race page and the Roster verify page
        run: tests/browser/run-all.sh --build-only
      - name: Own the compiler cache (Docker wrote it as root)
        run: sudo chown -R "$(id -u):$(id -g)" .toolchain/ccache
      - name: Save the compiler cache
        uses: actions/cache/save@v6
        with:
          path: .toolchain/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
      - name: Save the lean-vir build
        uses: actions/cache/save@v6
        with:
          path: vir/.lake
          key: vir-lake-${{ runner.os }}-${{ hashFiles('vir/lean-toolchain') }}-${{ hashFiles('vir/lakefile.toml', 'vir/lake-manifest.json') }}-${{ github.sha }}
      - name: Save the QED64 lane's downloads
        if: steps.qed64-pin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            qed64/.cache/rt
            qed64/.cache/init
            qed64/.cache/node
            qed64/.cache/build/init-olean
            qed64/.cache/build/std
            qed64/.cache/build/std-olean
            qed64/.cache/build/wasm
          key: ${{ steps.qed64-pin.outputs.cache-primary-key }}
      - name: Save the QED64 lane's build
        if: steps.qed64-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            qed64/.cache/build/out
            qed64/.cache/build/snap
            qed64/.lake
          key: ${{ steps.qed64-build.outputs.cache-primary-key }}
      # The lane's sessions under Node, against the compiled reference (qed64/README.md, "Tests"),
      # with the Node 24 qed64/tools/node.sh pins (lean.wasm needs Memory64; this job's Node is 22)
      - name: QED64 lane (Node)
        run: |
          "$(qed64/tools/node.sh)" qed64/test/node.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright (outside the checkout)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          echo '{ "private": true }' > package.json
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium firefox
          echo "LEANUI_PLAYWRIGHT_FROM=$RUNNER_TEMP/pw/package.json" >> "$GITHUB_ENV"
      # The editor core's goldens against an independent Python implementation, and the JavaScript
      # port the benchmarks compare with against the same goldens (well under a second, no build).
      - name: Editor goldens (Python reference, JavaScript port)
        run: python3 tests/editor-ref/reference.py tests/Editor.lean && node bench/editor/check-goldens.mjs
      - name: Browser tests (Chromium, Firefox)
        run: tests/browser/run-all.sh

      # The editor's and the video lab's benchmarks (docs/BENCHMARKS.md, "The photo editor"): only on a pull request
      # labelled `bench`, and they never fail the build. The JSON goes up as the `bench` artifact.
      - name: Editor benchmarks (Chromium, Firefox)
        if: contains(github.event.pull_request.labels.*.name, 'bench')
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          .lake/build/bin/leanui serve dist --port 5332 --quiet &
          srv=$!
          trap 'kill $srv' EXIT
          for _ in $(seq 1 100); do curl -fsS -o /dev/null http://127.0.0.1:5332/editor/index.html && break; sleep 0.2; done
          node tests/browser/editor-bench.mjs http://127.0.0.1:5332/ chromium --sizes 1,4,12 --runs 3 --out "$RUNNER_TEMP/bench/editor-bench-chromium.json"
          node tests/browser/editor-bench.mjs http://127.0.0.1:5332/ firefox --sizes 1,4,12 --runs 3 --out "$RUNNER_TEMP/bench/editor-bench-firefox.json"
          node tests/browser/editor-perf.mjs http://127.0.0.1:5332/editor/index.html chromium --out "$RUNNER_TEMP/bench/editor-perf-chromium.json" > /dev/null
          node tests/browser/editor-perf.mjs http://127.0.0.1:5332/editor/index.html firefox --quick --out "$RUNNER_TEMP/bench/editor-perf-firefox.json" > /dev/null
          node tests/browser/video.mjs http://127.0.0.1:5332/editor/video/index.html chromium --perf --out "$RUNNER_TEMP/bench/video-chromium.json"
          node tests/browser/video.mjs http://127.0.0.1:5332/editor/video/index.html firefox --perf --out "$RUNNER_TEMP/bench/video-firefox.json"
      # The same pull requests: the keyed benchmark and the race (bench/race/), each in vanilla
      # JavaScript, LeanUI on wasm64 and LeanUI on lean-vir, and the race also on Lean's interpreter
      # on QED64. The interpreters take most of the time.
      - name: Keyed and race benchmarks with lean-vir and QED64 (Chromium)
        if: contains(github.event.pull_request.labels.*.name, 'bench')
        continue-on-error: true
        timeout-minutes: 60
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          node tests/browser/bench.mjs --engines chromium --runs 5 --impls leanui,vanilla,leanvir --json "$RUNNER_TEMP/bench/keyed-chromium.json"
          .lake/build/bin/leanui serve dist --port 5333 --quiet --coop &   # cross-origin isolated: a precise timer for the race
          srv=$!
          trap 'kill $srv' EXIT
          for _ in $(seq 1 100); do curl -fsS -o /dev/null http://127.0.0.1:5333/race/index.html && break; sleep 0.2; done
          node tests/browser/race.mjs http://127.0.0.1:5333/ chromium --perf --lanes vanilla,wasm64,vir,qed64 --out "$RUNNER_TEMP/bench/race-chromium.json"
      - uses: actions/upload-artifact@v7
        if: contains(github.event.pull_request.labels.*.name, 'bench')
        with:
          name: bench
          path: ${{ runner.temp }}/bench
          retention-days: 14

      - name: Stage and smoke-test the site container
        run: |
          deploy/cloudflare/stage.sh
          docker build --platform linux/amd64 -t leanui-site:ci deploy/cloudflare
          id=$(docker run -d -p 127.0.0.1:8080:8080 leanui-site:ci)
          trap 'docker rm -f "$id" > /dev/null' EXIT
          for _ in $(seq 1 100); do curl -fsS -o "$RUNNER_TEMP/home.html" http://127.0.0.1:8080/ && break; sleep 0.2; done
          grep -q "Web UIs, written in Lean 4." "$RUNNER_TEMP/home.html"
          curl -fsS -o /dev/null http://127.0.0.1:8080/assets/site/app.wasm
          curl -fsS -o /dev/null http://127.0.0.1:8080/site.css
          curl -fsS -o /dev/null -D "$RUNNER_TEMP/wasm.headers" -H 'accept-encoding: br, gzip' http://127.0.0.1:8080/assets/site/app.wasm
          grep -qi '^content-encoding: br' "$RUNNER_TEMP/wasm.headers"
          curl -fsS http://127.0.0.1:8080/editor/ | grep -q "LeanUI Photo"
          curl -fsS -o /dev/null http://127.0.0.1:8080/editor/app.wasm
          curl -fsS http://127.0.0.1:8080/editor/video/ | grep -q "LeanUI Video"
          curl -fsS -o /dev/null http://127.0.0.1:8080/editor/video/app.wasm
          curl -fsS http://127.0.0.1:8080/race/ | grep -q "LeanUI race"
          curl -fsS -o /dev/null http://127.0.0.1:8080/race/life/wasm64/app.wasm
          runtime=$(curl -fsS http://127.0.0.1:8080/race/life/vir/app.json | node -p 'JSON.parse(require("fs").readFileSync(0)).runtimeModule')
          curl -fsS -o /dev/null -D "$RUNNER_TEMP/vir.headers" -H 'accept-encoding: br, gzip' "http://127.0.0.1:8080/race/life/vir/${runtime%.js}.wasm"
          grep -qi '^content-encoding: br' "$RUNNER_TEMP/vir.headers"
          # the race's QED64 lane: lean.wasm brotli-encoded and immutable, and the snapshot (stage.sh
          # keeps qed64/build.sh's files as they are)
          lane=$(curl -fsS http://127.0.0.1:8080/race/life/qed64/qed64.json)
          wasm=$(node -p 'JSON.parse(process.argv[1]).leanWasm' "$lane") snap=$(node -p 'JSON.parse(process.argv[1]).snapshot' "$lane")
          curl -fsS -o /dev/null -D "$RUNNER_TEMP/qed64.headers" -H 'accept-encoding: br, gzip' "http://127.0.0.1:8080/race/qed64-rt/$wasm"
          grep -qi '^content-encoding: br' "$RUNNER_TEMP/qed64.headers"
          grep -qi '^cache-control: .*immutable' "$RUNNER_TEMP/qed64.headers"
          curl -fsS -o /dev/null --head "http://127.0.0.1:8080/race/qed64-rt/$snap"
          # the Roster demo, without its notary: the app and the verify page, on the receipt staged
          curl -fsS http://127.0.0.1:8080/roster/ | grep -q "Roster"
          curl -fsS -o /dev/null -D "$RUNNER_TEMP/receipt.headers" -H 'accept-encoding: br, gzip' http://127.0.0.1:8080/roster/receipts/feasible.ndjson
          grep -qi '^content-encoding: br' "$RUNNER_TEMP/receipt.headers"
          node tests/browser/roster.mjs http://127.0.0.1:8080/roster/ chromium
          node tests/browser/roster-verify.mjs "http://127.0.0.1:8080/roster/verify/?receipt=/roster/receipts/feasible.ndjson" chromium
          tar -C deploy/cloudflare -czf "$RUNNER_TEMP/site-container.tgz" site
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: site-container
          path: ${{ runner.temp }}/site-container.tgz
          retention-days: 7

  # The Roster demo's completeness proof (roster/hall/README.md): Hall's marriage theorem, from
  # Mathlib, which the main build never reads. Mathlib's prebuilt files come from its cache (only
  # the modules RosterHall.lean imports); nothing of Mathlib compiles.
  hall:
    name: Roster completeness proof (Mathlib)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat roster/hall/lean-toolchain)"
      - name: Check the proof
        run: roster/hall/build.sh

  deploy:
    name: Deploy the site to Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    # The secrets reach only the two steps that need them (not npm install).
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set: skipping the deploy (docs/DEPLOY.md)"; fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/download-artifact@v8
        if: steps.creds.outputs.ok == 'true'
        with:
          name: site-container
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install wrangler
        if: steps.creds.outputs.ok == 'true'
        working-directory: deploy/cloudflare
        run: |
          tar -xzf "$RUNNER_TEMP/site-container.tgz"
          npm install --no-audit --no-fund
      - name: Deploy (wrangler builds the image, uploads the Worker, pushes the image)
        if: steps.creds.outputs.ok == 'true'
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash   # -o pipefail: a failed deploy must not pass through tee
        run: npx wrangler deploy | tee "$RUNNER_TEMP/deploy.log"
      # Visitors must get the precompressed wasm the server sends, not a re-encoded body
      # (docs/DEPLOY.md, "Compression"): the body's size is the sibling's size, which the server
      # writes into the ETag, and it decodes. The site's, the editor's and the QED64 lane's lean.wasm
      # (11 MB). Retried while the new version starts.
      - name: Check that the deployed wasm is the precompressed file
        if: steps.creds.outputs.ok == 'true'
        shell: bash
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          [ -n "$url" ] || { echo "::error::no workers.dev URL in wrangler's output"; exit 1; }
          lane=$(cd deploy/cloudflare/site/dist && ls race/qed64-rt/lean.*.wasm 2>/dev/null || true)
          cd "$RUNNER_TEMP"
          for path in assets/site/app.wasm editor/app.wasm $lane; do
            for attempt in $(seq 1 20); do
              got= want=
              if curl -sS --max-time 120 -D h -o b -H 'accept-encoding: br' "$url/$path"; then
                want=$(grep -i '^etag:' h | sed -E 's/.*"([0-9]+)-.*-br".*/\1/' || true)
                got=$(wc -c < b)
                if grep -qi '^content-encoding: br' h && [ "$got" = "$want" ] &&
                   node -e 'require("zlib").brotliDecompressSync(require("fs").readFileSync("b"))'; then
                  echo "$url/$path: $got bytes, the server's .br"; continue 2
                fi
              fi
              sleep 15
            done
            echo "::error::$url/$path: $got bytes received, the server sent $want (re-encoded on the way?)"; exit 1
          done
      - name: Wrangler's log
        if: failure()
        run: cat ~/.config/.wrangler/logs/*.log 2>/dev/null || echo "no wrangler log"
