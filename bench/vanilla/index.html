<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vanilla keyed</title>
<link rel="stylesheet" href="../bench.css"></head>
<body>
<!-- The reference: hand-written DOM code for the js-framework-benchmark keyed operations, with the
     same markup and the same 64-bit LCG labels as examples/Bench.lean, so both build identical
     tables. Template cloning, direct node references, event delegation: the usual fast path. -->
<div id="app"><div class="container">
  <div class="jumbotron"><div class="row">
    <div class="col-md-6"><h1>Vanilla (keyed)</h1></div>
    <div class="col-md-6"><div class="row">
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="run">Create 1,000 rows</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="runlots">Create 10,000 rows</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="add">Append 1,000 rows</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="update">Update every 10th row</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="clear">Clear</button></div>
      <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="swaprows">Swap Rows</button></div>
    </div></div>
  </div></div>
  <table class="table table-hover table-striped test-data"><tbody id="tbody"></tbody></table>
  <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
</div></div>
<script>
"use strict";
const adjectives = ["pretty", "large", "big", "small", "tall", "short", "long", "handsome", "plain", "quaint", "clean", "elegant", "easy", "angry", "crazy", "helpful", "mushy", "odd", "unsightly", "adorable", "important", "inexpensive", "cheap", "expensive", "fancy"];
const colours = ["red", "yellow", "blue", "green", "pink", "brown", "purple", "brown", "white", "black", "orange"];
const nouns = ["table", "chair", "house", "bbq", "desk", "car", "pony", "cookie", "sandwich", "burger", "pizza", "mouse", "keyboard"];
const M = (1n << 64n) - 1n;
let seed = 42n, nextId = 1;
const lcg = (s) => (s * 6364136223846793005n + 1442695040888963407n) & M;
const pick = (s, a) => a[Number((s >> 33n) % BigInt(a.length))];
const tbody = document.getElementById("tbody");
const tpl = document.createElement("template");
tpl.innerHTML = '<tr><td class="col-md-1"> </td><td class="col-md-4"><a class="lbl"> </a></td><td class="col-md-1"><a class="remove"><span class="remove glyphicon glyphicon-remove" aria-hidden="true"></span></a></td><td class="col-md-6"></td></tr>';
const proto = tpl.content.firstChild;
let rows = [];            // { id, label, tr, text }
let selected = null;      // the selected row object
function build(n) {
  const out = new Array(n);
  for (let i = 0; i < n; i++) {
    const s1 = lcg(seed), s2 = lcg(s1), s3 = lcg(s2); seed = s3;
    const label = pick(s1, adjectives) + " " + pick(s2, colours) + " " + pick(s3, nouns);
    const tr = proto.cloneNode(true);
    const id = nextId++;
    tr.firstChild.firstChild.nodeValue = id;
    const text = tr.childNodes[1].firstChild.firstChild; text.nodeValue = label;
    const r = { id, label, tr, text }; tr.__row = r; out[i] = r;
  }
  return out;
}
function append(rs) { const f = document.createDocumentFragment(); for (const r of rs) f.appendChild(r.tr); tbody.appendChild(f); rows = rows.concat(rs); }
function clear() { tbody.textContent = ""; rows = []; selected = null; }
const actions = {
  run() { clear(); append(build(1000)); },
  runlots() { clear(); append(build(10000)); },
  add() { append(build(1000)); },
  update() { for (let i = 0; i < rows.length; i += 10) { const r = rows[i]; r.label += " !!!"; r.text.nodeValue = r.label; } },
  clear,
  swaprows() {
    if (rows.length > 998) {
      const a = rows[1], b = rows[998], afterB = b.tr.nextSibling;
      tbody.insertBefore(b.tr, a.tr); tbody.insertBefore(a.tr, afterB);
      rows[1] = b; rows[998] = a;
    }
  },
};
document.getElementById("app").addEventListener("click", (e) => {
  const t = e.target;
  if (t.id && actions[t.id]) { actions[t.id](); return; }
  const a = t.closest("a"); if (!a) return;
  const r = a.closest("tr").__row;
  if (a.classList.contains("lbl")) { if (selected) selected.tr.className = ""; r.tr.className = "danger"; selected = r; }
  else if (a.classList.contains("remove")) { r.tr.remove(); rows.splice(rows.indexOf(r), 1); if (selected === r) selected = null; }
});
window.__ready = performance.now();
</script></body></html>
