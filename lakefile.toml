name = "leanui"
version = "0.1.0"
defaultTargets = ["LeanUI", "LeanUITesting", "leanui-tests", "Examples"]

[[lean_lib]]
name = "LeanUI"

[[lean_lib]]
name = "LeanUIHost"
roots = ["LeanUI.Host.Wasm"]

[[lean_lib]]
name = "Examples"
srcDir = "examples"
roots = ["Counter"]

[[lean_lib]]
name = "LeanUITesting"
roots = ["LeanUI.Testing.Dom", "LeanUI.Testing.Harness"]

[[lean_exe]]
name = "leanui-tests"
root = "tests.Main"
