{ const c = document.getElementById('c'); const off = c.transferControlToOffscreen(); const { port1 } = new MessageChannel(); port1.postMessage(off, [off]); try { c.getContext('2d'); f.canvasAfterTransfer = 'getContext ok?'; } catch (e) { f.canvasAfterTransfer = 'throws ' + e.name; } }
