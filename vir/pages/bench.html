<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LeanUI keyed (lean-vir)</title>
<link rel="stylesheet" href="../bench.css"></head>
<body><div id="app"></div><script src="leanui.js"></script><script src="leanui-vir.js"></script><script>
LeanUIVir.start({ app: "LeanUIVir.BenchApp", selector: "#app" }).then((rt) => { window.__leanui = rt; window.__ready = performance.now(); console.log("LeanUI (lean-vir) ready in", rt.bootMs.toFixed(1), "ms"); },
  (e) => { if (e.name === "AbortError") return; console.error("LeanUI failed to start:", e); document.getElementById("app").textContent = "LeanUI failed to start: " + e.message; });
</script></body></html>
